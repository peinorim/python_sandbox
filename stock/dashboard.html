<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e1117;
      color: #c9d1d9;
      font-family: Arial, Helvetica, sans-serif;
      padding: 1rem;
    }
    header {
      text-align: center;
      padding: 0.8rem 0 1.2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .chart-cell {
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      overflow: hidden;
      min-height: 500px;
      position: relative;
    }
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    /* Spinner de chargement */
    .chart-cell:empty::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 28px; height: 28px;
      margin: -14px 0 0 -14px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Plotly chart remplit sa cellule */
    .chart-cell .plotly-graph-div {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <header>
    <h2>Dernière mise à jour : 2026-08-19T16:59:47 CEST</h2>
  </header>
  <div class="grid">
    <div class="chart-cell" id="chart-NVDA" data-src="offline/NVDA.html"></div>
    <div class="chart-cell" id="chart-ACA-PA" data-src="offline/ACA.PA.html"></div>
    <div class="chart-cell" id="chart-CSPX-AS" data-src="offline/CSPX.AS.html"></div>
    <div class="chart-cell" id="chart-CNDX-AS" data-src="offline/CNDX.AS.html"></div>
    <div class="chart-cell" id="chart-CW8-PA" data-src="offline/CW8.PA.html"></div>
    <div class="chart-cell" id="chart-ACWI-PA" data-src="offline/ACWI.PA.html"></div>
    <div class="chart-cell" id="chart-VGWE-AS" data-src="offline/VGWE.AS.html"></div>
    <div class="chart-cell" id="chart-EDEU-PA" data-src="offline/EDEU.PA.html"></div>
    <div class="chart-cell" id="chart-EMIM-AS" data-src="offline/EMIM.AS.html"></div>
    <div class="chart-cell" id="chart-CMSE-PA" data-src="offline/CMSE.PA.html"></div>
    <div class="chart-cell" id="chart-GOLD-MI" data-src="offline/GOLD.MI.html"></div>
    <div class="chart-cell" id="chart-_SPX" data-src="offline/^SPX.html"></div>
    <div class="chart-cell" id="chart-_NDX" data-src="offline/^NDX.html"></div>
    <div class="chart-cell" id="chart-GC-F" data-src="offline/GC=F.html"></div>
    <div class="chart-cell" id="chart-CL-F" data-src="offline/CL=F.html"></div>
    <div class="chart-cell" id="chart-EURUSD-X" data-src="offline/EURUSD=X.html"></div>
    <div class="chart-cell" id="chart-BTC-USD" data-src="offline/BTC-USD.html"></div>
    <div class="chart-cell" id="chart-XGSD-DE" data-src="offline/XGSD.DE.html"></div>
    <div class="chart-cell" id="chart-WINC-DE" data-src="offline/WINC.DE.html"></div>
    <div class="chart-cell" id="chart-ZPRG-DE" data-src="offline/ZPRG.DE.html"></div>
    <div class="chart-cell" id="chart-EEI-MI" data-src="offline/EEI.MI.html"></div>
    <div class="chart-cell" id="chart-EMHD-PA" data-src="offline/EMHD.PA.html"></div>
    <div class="chart-cell" id="chart-CSW-PA" data-src="offline/CSW.PA.html"></div>
  </div>

  <script>
    /**
     * Charge chaque fichier HTML Plotly via fetch() et l'injecte dans le DOM.
     * Plotly.js est déjà chargé globalement dans le <head>, donc on ignore les
     * scripts src et on ne réinjecte que les scripts inline (Plotly.newPlot, etc.).
     */
    document.querySelectorAll('.chart-cell[data-src]').forEach(cell => {
      fetch(cell.dataset.src)
        .then(r => r.text())
        .then(html => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const content = doc.body || doc.documentElement;

          // Injecter les éléments non-script
          cell.innerHTML = content.innerHTML;

          // Réinjecter uniquement les scripts inline (pas les src externes)
          content.querySelectorAll('script').forEach(oldScript => {
            if (oldScript.src) return; // Plotly.js déjà chargé, on skip
            const s = document.createElement('script');
            s.textContent = oldScript.textContent;
            cell.appendChild(s);
          });
        })
        .catch(() => {
          cell.innerHTML = '<p style="color:#f85149;padding:1rem;">Erreur de chargement</p>';
        });
    });
  </script>
</body>
</html>
