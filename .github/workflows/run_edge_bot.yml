name: Run edge bot

on:
  workflow_dispatch:  # permet aussi de le lancer manuellement

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      PAPER_MODE: "false"
      TZ: "UTC"
      POLY_API_KEY: ${{ secrets.POLY_API_KEY }}
      POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Python configuration
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Requirements installation
        run: |
          pip install -r requirements_bot.txt

      - name: Python run bot
        run: |
          cd bot
          python edge_bot.py
