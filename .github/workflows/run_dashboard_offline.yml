name: Stock forecast update

on:
  schedule:
    # S'exécute à 7:00, 7:15, ..., 20:45 UTC, du lundi au vendredi
    - cron: '*/30 6-19 * * 1-5'
  workflow_dispatch:  # permet aussi de le lancer manuellement

jobs:
  run-python:
    runs-on: ubuntu-latest

    env:
      OFFLINE: "true"
      TZ: "Europe/Paris"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python configuration
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Requirements installation
        run: |
          pip install -r requirements.txt

      - name: Python data update
        run: |
          cd stock
          python dashboard.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin master
          git add *
          
          # Vérifie s'il y a des changements
          if [ -n "$(git status --porcelain)" ]; then
            git add *
            git commit -m "🤖 Automatic update by workflow [$(date '+%Y-%m-%d %H:%M:%S')]"
            git pull --rebase origin master
            git push origin master
          else
            echo "Nothing to commit."
          fi
